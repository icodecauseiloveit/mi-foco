<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Foco · Tareas y metas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%234f46e5' stroke-width='4'/><circle cx='16' cy='16' r='5' fill='%234f46e5'/></svg>">
  <script>
    // Aplica el tema guardado antes de dibujar la página (sin parpadeo).
    (function () {
      var t = null;
      try { t = localStorage.getItem('mifoco-tema'); } catch (e) { /* sin almacenamiento */ }
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      var oscuro = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('tema-oscuro', oscuro);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="marca"><span class="logo"></span>Mi Foco</div>
    <nav id="nav">
      <button data-vista="hoy" class="activo"><span>☀</span>Hoy</button>
      <button data-vista="tareas"><span>☰</span>Tareas</button>
      <button data-vista="metas"><span>◆</span>Metas de aprendizaje</button>
      <button data-vista="rendimiento"><span>▲</span>Rendimiento</button>
      <button data-vista="historial"><span>⟲</span>Historial</button>
    </nav>
    <div class="sidebar-pie">
      <div class="herramientas" id="herramientas">
        <div class="herr-panel" id="herr-panel">
          <div class="herr-items">
            <span class="herr-grupo">Reportes</span>
            <button id="btn-reporte" class="enlace"><i>📤</i>Reporte de cumplimiento</button>
            <a class="enlace" href="/api/exportar/tareas.csv"><i>⬇</i>Exportar tareas (CSV)</a>
            <a class="enlace" href="/api/exportar/eventos.csv"><i>⬇</i>Exportar historial (CSV)</a>
            <span class="herr-grupo">Configuración</span>
            <button id="btn-catalogos" class="enlace"><i>🏷</i>Categorías y descripciones</button>
            <button id="btn-notif" class="enlace"><i>🔔</i>Activar notificaciones</button>
            <button id="btn-respaldo" class="enlace"><i>💾</i>Respaldar base de datos</button>
          </div>
        </div>
        <button id="btn-herramientas" class="herr-toggle" aria-expanded="false" aria-controls="herr-panel">
          <svg class="engrane" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.88 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.64 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
          <span>Herramientas</span>
          <span class="flecha" aria-hidden="true">▴</span>
        </button>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="titulo-vista">Hoy</h1>
        <p id="fecha-hoy" class="sutil"></p>
      </div>
      <div class="topbar-acciones">
        <div id="en-curso" class="en-curso oculto"></div>
        <button id="btn-tema" class="btn-icono btn-tema" title="Cambiar a modo oscuro" aria-label="Cambiar modo claro u oscuro"><span class="sol">☀️</span><span class="luna">🌙</span></button>
        <button id="btn-alertas" class="btn-icono" title="Alertas">🔔<span id="badge-alertas" class="badge oculto">0</span></button>
        <button id="btn-nueva" class="primario">+ Nueva tarea</button>
      </div>
    </header>
    <section id="vista" class="vista"></section>
  </main>

  <div id="panel-alertas" class="panel-alertas oculto"></div>
  <div id="modal" class="modal oculto"><div class="modal-caja" id="modal-caja"></div></div>
  <div id="toasts" class="toasts"></div>
  <script src="/static/app.js"></script>
  <script src="/static/reporte.js"></script>
</body>
</html>
